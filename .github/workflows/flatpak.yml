name: Flatpak

# Pushes to main and v* tags build the bundle through nightly.yml and release.yml, which call this
# workflow, so the published Flatpak is the one that passed these checks.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: BuildNotify.flatpak
          artifact-name: flatpak
          manifest-path: packaging/flatpak/io.github.anaynayak.BuildNotify.yml
          cache-key: flatpak-builder-${{ github.sha }}
          repo-dir: repo
      - name: Install flatpak-builder-lint
        run: flatpak install --system --noninteractive flathub org.flatpak.Builder
      - name: Lint manifest
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.anaynayak.BuildNotify.yml
      - name: Lint repo
        # Flathub mirrors screenshots during its own build, so these two errors only
        # clear there. Fail on anything else.
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo > lint.json || true
          cat lint.json
          flatpak run --command=python3 org.flatpak.Builder -c '
          import json, sys
          expected = {"appstream-external-screenshot-url", "appstream-screenshots-not-mirrored-in-ostree"}
          unexpected = set(json.load(sys.stdin).get("errors", [])) - expected
          sys.exit(f"Unexpected lint errors: {sorted(unexpected)}" if unexpected else 0)
          ' < lint.json
