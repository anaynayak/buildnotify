name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Sync
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run --locked ruff check
      - name: Format
        run: uv run --locked ruff format --check
      - name: Types
        run: uv run --locked mypy

  # No Windows job: pyqt5-qt5 5.15.19 (locked) ships no Windows wheels.
  # Revisit after the PySide6 migration.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Sync
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Test
        run: uv run --locked pytest -q
      - name: Test install
        if: runner.os == 'Linux'
        run: |
          uv build
          uv venv --python ${{ matrix.python }} /tmp/install-check
          uv pip install --python /tmp/install-check dist/*.whl
          /tmp/install-check/bin/python -c "import buildnotifylib"
          test -x /tmp/install-check/bin/buildnotify
