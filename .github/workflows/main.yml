name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run --locked ruff check
      - name: Format
        run: uv run --locked ruff format --check
      - name: Types
        run: uv run --locked mypy
      - name: Fuzz requirements are up to date
        run: |
          uv export --no-dev --no-emit-project --no-hashes --no-header --no-annotate | uv pip compile .clusterfuzzlite/requirements.in -c /dev/stdin --generate-hashes --no-header --no-annotate -o .clusterfuzzlite/requirements.txt -q
          git diff --exit-code .clusterfuzzlite/requirements.txt

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build the docs
        run: uv run --locked --group docs mkdocs build --strict

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build twice and compare hashes
        run: scripts/repro-check.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # What the offscreen platform plugin links; the xcb libraries are only needed on a display.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libx11-6 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Sync
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Test
        run: uv run --locked pytest -q
      - name: Test install
        if: runner.os == 'Linux'
        env:
          ICON_CHECK: |
            from PySide6.QtWidgets import QApplication
            from buildnotifylib.ui.build_icons import BuildIcons
            app = QApplication([])
            icons = BuildIcons()
            names = [icons.icon_name(status, symbolic) for status in icons.all_status for symbolic in (False, True)]
            assert not any(icons.fallback(name).isNull() for name in names)
        run: |
          uv build
          uv venv --python ${{ matrix.python }} /tmp/install-check
          uv pip install --python /tmp/install-check dist/*.whl
          /tmp/install-check/bin/python -c "import buildnotifylib"
          /tmp/install-check/bin/python -c "$ICON_CHECK"
          test -x /tmp/install-check/bin/buildnotify
