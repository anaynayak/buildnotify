name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Sync
        run: uv sync --locked --python 3.12
      - name: Vulture
        run: uvx vulture buildnotifylib/ test/whitelist.py --exclude generated
      - name: Test
        run: uv run --locked pytest -q
      - name: Test install
        run: |
          uv build
          uv venv --python 3.12 /tmp/install-check
          uv pip install --python /tmp/install-check dist/*.whl
          /tmp/install-check/bin/python -c "import buildnotifylib"
          test -x /tmp/install-check/bin/buildnotify
