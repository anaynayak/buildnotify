name: nightly

# Every push to main builds dev-versioned artifacts and replaces the rolling `nightly`
# pre-release. It never publishes to PyPI, and the `nightly` tag doesn't match release.yml's v*.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Set a dev version in this workspace only
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(python3 -c 'import runpy; print(runpy.run_path("buildnotifylib/version.py")["VERSION"])')
          # Dev builds of the next patch release, so they sort after the last release.
          next=$(python3 -c 'import sys; m, n, p = sys.argv[1].split("."); print(f"{m}.{n}.{int(p) + 1}")' "$base")
          echo "VERSION = \"${next}.dev${RUN_NUMBER}\"" > buildnotifylib/version.py
          cat buildnotifylib/version.py
      - name: Build dist
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          uv build
          ls dist
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Collect the provenance bundle as an intoto.jsonl asset
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          version=$(python3 -c 'import runpy; print(runpy.run_path("buildnotifylib/version.py")["VERSION"])')
          mkdir provenance
          jq -c . "$BUNDLE" > "provenance/buildnotify-${version}.intoto.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: provenance/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  flatpak:
    permissions:
      contents: read
    uses: ./.github/workflows/flatpak.yml

  nightly:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: assets/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: assets/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak
          path: assets/
      - name: Replace the nightly pre-release
        run: |
          printf '%s\n' \
            "Development build of $SHA. It is not a release and may be broken." \
            "" \
            "Commit: https://github.com/$GH_REPO/commit/$SHA" \
            "Changes since the last release: see Unreleased in https://github.com/$GH_REPO/blob/$SHA/CHANGELOG" > notes.md
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly assets/* \
            --target "$SHA" \
            --title "Nightly ($(echo "$SHA" | cut -c1-7))" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
