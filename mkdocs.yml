site_name: BuildNotify
site_description: BuildNotify is a system tray build status notification app.
site_url: https://anaynayak.github.io/buildnotify/
repo_url: https://github.com/anaynayak/buildnotify
repo_name: anaynayak/buildnotify

# Pages build as installation.html etc., so the old Jekyll URLs keep working.
use_directory_urls: false

docs_dir: docs
site_dir: site

# Not part of the site: review reports and the rewrite draft.
exclude_docs: |
  *.html
  rust-gpui-rewrite-analysis.md

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - FAQ: faq.md

theme:
  name: material
  logo: images/buildnotify.svg
  favicon: images/buildnotify.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
