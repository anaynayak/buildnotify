; Written before mutes: servers have a kind but no muted key.
[General]
schema_version=4
show_last_build_label=false
sort_key=sort_build_time

[connection]
interval_in_seconds=60
timeout=10

[notifications]
custom_script=echo #status# #projects# >> /tmp/buildnotify.log
custom_script_enabled=false

[servers]
1\authorization_type=0
1\branch=
1\display_prefix=go
1\excludes=deploy-prod
1\kind=cctray
1\repository=
1\skip_ssl_verification=false
1\timezone=US/Eastern
1\url=https://ci.example.com/go/cctray.xml
1\username=alice
1\workflow=
2\authorization_type=1
2\branch=main
2\display_prefix=
2\excludes=@Invalid()
2\kind=github
2\repository=octo-org/hello-world
2\skip_ssl_verification=false
2\timezone=None
2\url=https://github.com/octo-org/hello-world
2\username=
2\workflow=
size=2

[tray]
symbolic_icons=false
