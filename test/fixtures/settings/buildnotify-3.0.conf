; Written by the 3.0 SettingsStore: servers have no kind key.
[General]
schema_version=3
show_last_build_label=false
sort_key=sort_build_time

[connection]
interval_in_seconds=60
timeout=10

[notifications]
custom_script=echo #status# #projects# >> /tmp/buildnotify.log
custom_script_enabled=false

[servers]
1\authorization_type=0
1\display_prefix=go
1\excludes=deploy-prod
1\skip_ssl_verification=false
1\timezone=US/Eastern
1\url=https://ci.example.com/go/cctray.xml
1\username=alice
2\authorization_type=1
2\display_prefix=
2\excludes=@Invalid()
2\skip_ssl_verification=false
2\timezone=None
2\url=http://jenkins.local:8080/cc.xml
2\username=
size=2

[tray]
symbolic_icons=false
