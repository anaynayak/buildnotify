; ~/.config/BuildNotify/BuildNotify.conf as written by BuildNotify 2.1.0 on Linux: three servers,
; one nested under another, a keyring username, a bearer token and a one-item exclude list.
[General]
sort_key=sort_name

[authorization_type]
http%3A\jenkins.local%3A8080=0
http%3A\jenkins.local%3A8080\cc.xml=1
https%3A\ci.example.com\go\cctray.xml=0

[connection]
interval_in_seconds=300
timeout=10
urls=https://ci.example.com/go/cctray.xml, http://jenkins.local:8080/cc.xml, http://jenkins.local:8080

[display_prefix]
http%3A\jenkins.local%3A8080=root
http%3A\jenkins.local%3A8080\cc.xml=
https%3A\ci.example.com\go\cctray.xml=go

[excludes]
http%3A\jenkins.local%3A8080=@Invalid()
http%3A\jenkins.local%3A8080\cc.xml=nightly, flaky :: tests
https%3A\ci.example.com\go\cctray.xml=@Variant(\0\0\0\t\0\0\0\x1\0\0\0\n\0\0\0\x16\0\x64\0\x65\0p\0l\0o\0y\0-\0p\0r\0o\0\x64)

[notifications]
custom_script=notify-send #status#
custom_script_enabled=true

[skip_ssl_verification]
http%3A\jenkins.local%3A8080=false
http%3A\jenkins.local%3A8080\cc.xml=false
https%3A\ci.example.com\go\cctray.xml=true

[timezone]
http%3A\jenkins.local%3A8080=None
http%3A\jenkins.local%3A8080\cc.xml=None
https%3A\ci.example.com\go\cctray.xml=US/Eastern

[username]
http%3A\jenkins.local%3A8080=
http%3A\jenkins.local%3A8080\cc.xml=
https%3A\ci.example.com\go\cctray.xml=alice

[values]
brokenBuild=true
connectivityIssues=false
fixedBuild=false
lastBuildTimeForProject=true
stillFailingBuild=true
successfulBuild=true
