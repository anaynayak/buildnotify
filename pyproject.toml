[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "BuildNotify"
dynamic = ["version"]
description = "Cruise Control build monitor for Windows/Linux/Mac"
readme = "README.rst"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Anay Nayak", email = "anayak007@gmail.com" }]
keywords = ["cctray", "ccmenu", "buildnotify", "ubuntu", "linux", "cruisecontrol", "continuous integration", "ci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = [
    "PyQt5>=5.15.11,<5.16",
    "requests",
    "keyring",
    "defusedxml",
    "tzdata; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://anaynayak.github.io/buildnotify/"
Source = "https://github.com/anaynayak/buildnotify"

[project.gui-scripts]
buildnotify = "buildnotifylib.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-qt>=4.5",
    "pytest-cov>=7",
    "pytest-mock>=3.15",
    "requests-mock>=1.12",
    "PyQt5-stubs==5.15.6.0",
    "ruff>=0.16.10",
    "mypy>=1.18",
    "hypothesis>=6",
]

[tool.hatch.version]
path = "buildnotifylib/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/buildnotifylib",
    "/data",
    "/icons",
    "/test",
    "/buildnotify.desktop",
    "/buildnotify.svg",
    "/CHANGELOG",
    "/pytest.ini",
]

[tool.hatch.build.targets.wheel]
packages = ["buildnotifylib"]

[tool.hatch.build.targets.wheel.shared-data]
"buildnotify.desktop" = "share/applications/buildnotify.desktop"
"buildnotify.svg" = "share/pixmaps/buildnotify.svg"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["buildnotifylib/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
files = ["buildnotifylib", "test"]
exclude = ["^buildnotifylib/generated/"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "buildnotifylib.generated.*"
ignore_errors = true
